name: Deploy API to Production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-api-production
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["OpenMemory Docker Build and Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  get-image-tag:
    uses: ./.github/workflows/deployment-get-image-tag.yml
    with:
      service-name: api
      run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      target-ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || '' }}
      target-ref-name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
    secrets: inherit

  deploy:
    needs: get-image-tag
    if: needs.get-image-tag.outputs.image-tag != '' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true

      - name: Deploy API to container app
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ needs.get-image-tag.outputs.image-tag }}
          acrName: schoollawregistry
          containerAppName: mem0-api
          containerAppEnvironment: ComplianceTheatre2000
          resourceGroup: SchoolLawyer
          environmentVariables: AUTH_ENABLED=${{ vars.AUTH_ENABLED }} AZURE_MONITOR_SAMPLING_RATIO="${{ vars.AZURE_MONITOR_SAMPLING_RATIO }}" AZURE_MONITOR_CONNECTION_STRING="${{ secrets.AZURE_MONITOR_CONNECTION_STRING }}" DATABASE_URL=${{ vars.DATABASE_URL }} EMBEDDING_AZURE_ENDPOINT="${{ vars.EMBEDDING_AZURE_ENDPOINT }}" EMBEDDING_AZURE_API_VERSION="${{ vars.EMBEDDING_AZURE_API_VERSION }}" EMBEDDING_AZURE_DEPLOYMENT="${{ vars.EMBEDDING_AZURE_DEPLOYMENT }}" EMBEDDING_AZURE_OPENAI_API_KEY=secretref:openai-schoollaw-embedding GRAPH_URI="${{ vars.GRAPH_URI }}" GRAPH_USERNAME="${{ vars.GRAPH_USERNAME }}"  GRAPH_PASSWORD=secretref:neo4j-password KEYCLOAK_SERVER_URL="${{ vars.KEYCLOAK_SERVER_URL }}" KEYCLOAK_REALM="${{ vars.KEYCLOAK_REALM }}" KEYCLOAK_CLIENT_ID=secretref:keystore-client-id KEYCLOAK_CLIENT_SECRET=secretref:keystore-client-secret LLM_AZURE_OPENAI_API_KEY=secretref:openai-schoollaw-1k-key1 LLM_AZURE_API_VERSION="${{ vars.LLM_AZURE_API_VERSION }}" LLM_AZURE_DEPLOYMENT="${{ vars.LLM_AZURE_DEPLOYMENT }}" LLM_AZURE_ENDPOINT="${{ vars.LLM_AZURE_ENDPOINT }}" LOG_LEVEL=warning MEMGRAPH_USERNAME="${{ vars.MEMGRAPH_USERNAME }}" MEM0_PROVIDER_VECTORSTORE="${{ vars.MEM0_PROVIDER_VECTORSTORE }}" MEM0_PROVIDER_GRAPHSTORE="${{ vars.MEM0_PROVIDER_GRAPHSTORE }}" MEM0_PROVIDER_LLM="${{ vars.MEM0_PROVIDER_LLM }}" MEM0_EXTRACTION_PROMPT="${{ vars.MEM0_EXTRACTION_PROMPT }}" MEM0_UPDATE_MEMORY_PROMPT="${{ vars.MEM0_UPDATE_MEMORY_PROMPT }}" NEXT_PUBLIC_URL="${{ vars.NEXT_PUBLIC_URL }}" OPENAI_API_KEY=secretref:openai-schoollawbot-1k-switzerland-key1 PGVECTOR_USER="${{ vars.PGVECTOR_USER }}" PGVECTOR_PORT="${{ vars.PGVECTOR_PORT }}" PGVECTOR_DB="${{ vars.PGVECTOR_DB }}" PGVECTOR_COLLECTION_NAME="${{ vars.PGVECTOR_COLLECTION_NAME }}" PGVECTOR_DISKANN=${{ vars.PGVECTOR_DISKANN }} PGVECTOR_PASSWORD=secretref:postgresql-password PG_HNSW=${{ vars.PG_HNSW }} PG_TIMESCALE=${{ vars.PG_TIMESCALE }} PUBLIC_URL="${{ vars.PUBLIC_URL }}" USER="${{ vars.USER }}" VERCEL="${{ vars.VERCEL }}" 
