# @format

name: Certbot-Azure Docker Build and Deploy

on:
  push:
    branches: [implementation/school-law, development]
    tags: ["release/*"]
    paths:
      - "openmemory/certbot-azure/**"
      - ".github/workflows/deployment-certbot-azure.yml"
  pull_request:
    branches: [implementation/school-law, development]
    paths:
      - "openmemory/certbot-azure/**"
      - ".github/workflows/deployment-certbot-azure.yml"
  workflow_dispatch:

env:
  REGISTRY: schoollawregistry.azurecr.io
  IMAGE_NAME: openmemory-certbot-azure

jobs:
  build_and_push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute branch prefix for SHA tag
        id: compute_prefix
        shell: bash
        run: |
          # Derive a safe Docker tag prefix from the branch name, if present
          RAW_BRANCH="${GITHUB_REF_NAME}"
          PREFIX=""
          if [[ -n "$RAW_BRANCH" ]]; then
            # Sanitize branch name for Docker tag:
            # 1. Lowercase
            SAFE=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]')
            # 2. Replace invalid characters with '-'
            SAFE=$(echo "$SAFE" | sed -E 's/[^a-z0-9._-]+/-/g')
            # 3. Trim leading dashes
            SAFE=$(echo "$SAFE" | sed -E 's/^-+//')
            # 4. Trim trailing dashes
            SAFE=$(echo "$SAFE" | sed -E 's/-+$//')
            # 5. Collapse multiple dashes
            SAFE=$(echo "$SAFE" | sed -E 's/-{2,}/-/g')
            if [[ -n "$SAFE" ]]; then
              PREFIX="${SAFE}-"
            fi
          fi
          echo "sha_prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry (token)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=sha,format=short,prefix=${{ steps.compute_prefix.outputs.sha_prefix }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/implementation/school-law' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: openmemory/certbot-azure
          file: openmemory/certbot-azure/Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64

      - name: Write output digest to metadata file
        if: github.event_name != 'pull_request'
        run: |
          # Generate clean metadata with individual components
          # This avoids complex tag parsing and lets deployment workflows construct what they need

          # Get short SHA (first 7 chars)
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Create branch-safe prefix for tag construction
          RAW_BRANCH="${{ github.ref_name }}"
          BRANCH_PREFIX=""
          if [[ -n "$RAW_BRANCH" ]]; then
            # Sanitize branch name for Docker tag (stepwise for clarity)
            SAFE_LOWER=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]')
            SAFE_ALNUM=$(echo "$SAFE_LOWER" | sed -E 's/[^a-z0-9._-]+/-/g')
            SAFE_TRIM=$(echo "$SAFE_ALNUM" | sed -E 's/^-+|[-]+$//g')
            SAFE=$(echo "$SAFE_TRIM" | sed -E 's/-{2,}/-/g')
            if [[ -n "$SAFE" ]]; then
              BRANCH_PREFIX="${SAFE}-"
            fi
          fi

          # Construct the tag we want to use (branch-prefix + short SHA)
          TAG="${BRANCH_PREFIX}${SHORT_SHA}"

          echo "{\"service\": \"certbot-azure\", \"image\": \"${{ env.IMAGE_NAME }}\", \"branch\": \"${{ github.ref_name }}\", \"registry\": \"${{ env.REGISTRY }}\", \"tag\": \"$TAG\", \"sha\": \"$GITHUB_SHA\", \"short_sha\": \"$SHORT_SHA\", \"repository\": \"${{ github.repository }}\"}" > metadata.json

          echo "Generated metadata for certbot-azure:"
          cat metadata.json

      - name: Upload build metadata artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: certbot-azure-metadata
          path: metadata.json

      - name: Summarize build results
        shell: bash
        run: |
          {
            echo '### Certbot-Azure Build Results'
            echo ''
            echo '**Service**: certbot-azure'
            echo '**Image**: ${{ env.IMAGE_NAME }}'
            echo '**Registry**: ${{ env.REGISTRY }}'
            echo '**Branch**: ${{ github.ref_name }}'
            echo '**SHA**: ${{ github.sha }}'
            echo ''
            if [[ "${{ github.event_name }}" == "pull_request" ]]; then
              echo '**Status**: Built successfully (not pushed - PR)'
            else
              echo '**Status**: Built and pushed successfully'
              echo '**Tags**:'
              echo '${{ steps.meta.outputs.tags }}' | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
