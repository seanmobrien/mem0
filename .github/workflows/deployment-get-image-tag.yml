name: Get Image Tag for Service

on:
  workflow_call:
    inputs:
      run-id:
        required: false
        type: string
        description: "Optional run ID to download artifacts from. If not provided, will find latest successful run."
      service-name:
        required: true
        type: string
        description: "Service name to get image tag for (api, ui, keycloak, neo4j)"
      target-ref:
        required: false
        type: string
        description: "Target ref (branch/tag) to find artifacts for. If not provided, uses current ref."
      target-ref-name:
        required: false
        type: string
        description: "Target ref name to find artifacts for. If not provided, uses current ref name."
    outputs:
      image-tag:
        value: ${{ jobs.get-tag.outputs.image-tag }}
        description: "Image tag for the service, or empty string if not found"

jobs:
  get-tag:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.extract-tag.outputs.image-tag }}
    steps:
      - name: Download build metadata artifacts (from provided run-id)
        if: inputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run-id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve and download artifacts for latest successful run
        if: inputs.run-id == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Use target ref if provided, otherwise fall back to current ref
          if [[ -n "${{ inputs.target-ref }}" ]]; then
            REF='${{ inputs.target-ref }}'
            REF_NAME='${{ inputs.target-ref-name }}'
          else
            REF='${{ github.ref }}'
            REF_NAME='${{ github.ref_name }}'
          fi

          OWNER_REPO='${{ github.repository }}'
          WORKFLOW_NAME='OpenMemory Docker Build and Deploy'

          echo "Looking for artifacts from ref: $REF (name: $REF_NAME)"

          WF_ID=$(gh api -q ".workflows[] | select(.name==\"${WORKFLOW_NAME}\").id" \
            repos/${OWNER_REPO}/actions/workflows || true)
          if [[ -z "$WF_ID" ]]; then
            echo "Workflow not found: $WORKFLOW_NAME"
            exit 0
          fi

          RUNS_JSON=$(gh api repos/${OWNER_REPO}/actions/workflows/${WF_ID}/runs --paginate -q '.workflow_runs[] | {id, event, conclusion, head_branch, head_sha, run_number, created_at}' | jq -s .)

          RUN_ID=""
          if [[ "$REF" == refs/heads/* ]]; then
            RUN_ID=$(echo "$RUNS_JSON" | jq -r \
              "map(select((.event==\"push\" or .event==\"workflow_dispatch\") and .conclusion==\"success\" and .head_branch==\"$REF_NAME\")) | sort_by(.created_at) | last | .id // \"\"")
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="$REF_NAME"
            TAG_OBJ=$(gh api repos/${OWNER_REPO}/git/ref/tags/${TAG_NAME} || true)
            COMMIT_SHA=""
            if [[ -n "$TAG_OBJ" ]]; then
              TYPE=$(echo "$TAG_OBJ" | jq -r '.object.type')
              SHA=$(echo "$TAG_OBJ" | jq -r '.object.sha')
              if [[ "$TYPE" == "commit" ]]; then
                COMMIT_SHA="$SHA"
              elif [[ "$TYPE" == "tag" ]]; then
                COMMIT_SHA=$(gh api repos/${OWNER_REPO}/git/tags/${SHA} -q '.object.sha' || echo "")
              fi
            fi
            if [[ -n "$COMMIT_SHA" ]]; then
              RUN_ID=$(echo "$RUNS_JSON" | jq -r \
                "map(select((.event==\"push\" or .event==\"workflow_dispatch\") and .conclusion==\"success\" and .head_sha==\"$COMMIT_SHA\")) | sort_by(.created_at) | last | .id // \"\"")
            fi
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "No matching successful build run found for $REF."
            exit 0
          fi

          echo "Downloading artifacts from run $RUN_ID ..."
          gh run download "$RUN_ID" --repo "$OWNER_REPO" -D artifacts || true

      - name: Extract image tag from service metadata
        id: extract-tag
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_NAME="${{ inputs.service-name }}"
          METADATA_FILE="artifacts/${SERVICE_NAME}-metadata/metadata.json"

          if [[ ! -f "$METADATA_FILE" ]]; then
            echo "Metadata file not found: $METADATA_FILE"
            echo "Available files in artifacts:"
            find artifacts -type f -name "*.json" || echo "No JSON files found"
            echo "image-tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract individual components from metadata
          REGISTRY=$(jq -r '.registry // ""' "$METADATA_FILE")
          IMAGE=$(jq -r '.image // ""' "$METADATA_FILE")
          TAG=$(jq -r '.tag // ""' "$METADATA_FILE")

          if [[ -n "$REGISTRY" && -n "$IMAGE" && -n "$TAG" && "$REGISTRY" != "null" && "$IMAGE" != "null" && "$TAG" != "null" ]]; then
            # Construct clean image reference from components
            FULL_IMAGE_REF="${REGISTRY}/${IMAGE}:${TAG}"
            echo "image-tag=$FULL_IMAGE_REF" >> "$GITHUB_OUTPUT"
            echo "Found image reference for $SERVICE_NAME: $FULL_IMAGE_REF"
            echo "  Registry: $REGISTRY"
            echo "  Image: $IMAGE"
            echo "  Tag: $TAG"
          else
            echo "image-tag=" >> "$GITHUB_OUTPUT"
            echo "Missing required metadata components for $SERVICE_NAME"
            echo "  Registry: $REGISTRY"
            echo "  Image: $IMAGE"
            echo "  Tag: $TAG"
          fi
