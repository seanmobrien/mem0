name: Get Image Tag for Service

on:
  workflow_call:
    inputs:
      run-id:
        required: false
        type: string
        description: "Optional run ID to download artifacts from. If not provided, will find latest successful run."
      service-name:
        required: true
        type: string
        description: "Service name to get image tag for (api, ui, keycloak, neo4j)"
    outputs:
      image-tag:
        value: ${{ jobs.get-tag.outputs.image-tag }}
        description: "Image tag for the service, or empty string if not found"

jobs:
  get-tag:
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.extract-tag.outputs.image-tag }}
    steps:
      - name: Download build metadata artifacts (from provided run-id)
        if: inputs.run-id != ''
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ inputs.run-id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # When no run-id is provided, locate the latest successful run of
      # "OpenMemory Docker Build and Deploy" for the same ref (branch/tag)
      # and download its artifacts
      - name: Resolve and download artifacts for latest successful run
        if: inputs.run-id == ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Context used to locate build artifacts for the same branch/tag
          OWNER_REPO='${{ github.repository }}'
          WORKFLOW_NAME='OpenMemory Docker Build and Deploy'
          REF='${{ github.ref }}'
          REF_NAME='${{ github.ref_name }}'

          # Find workflow id by name
          WF_ID=$(gh api -q ".workflows[] | select(.name==\"${WORKFLOW_NAME}\").id" \
            repos/${OWNER_REPO}/actions/workflows || true)
          if [[ -z "$WF_ID" ]]; then
            echo "Workflow not found: $WORKFLOW_NAME"
            exit 0
          fi

          # List recent runs for that workflow
          RUNS_JSON=$(gh api repos/${OWNER_REPO}/actions/workflows/${WF_ID}/runs --paginate -q '.workflow_runs[] | {id, event, conclusion, head_branch, head_sha, run_number, created_at}' | jq -s .)

          # Determine matching run for branch or tag
          RUN_ID=""
          if [[ "$REF" == refs/heads/* ]]; then
            # Latest successful run for the same branch
            RUN_ID=$(echo "$RUNS_JSON" | jq -r \
              "map(select((.event==\"push\" or .event==\"workflow_dispatch\") and .conclusion==\"success\" and .head_branch==\"$REF_NAME\")) | sort_by(.created_at) | last | .id // \"\"")
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="$REF_NAME"
            # Resolve commit SHA for the tag
            TAG_OBJ=$(gh api repos/${OWNER_REPO}/git/ref/tags/${TAG_NAME} || true)
            COMMIT_SHA=""
            if [[ -n "$TAG_OBJ" ]]; then
              TYPE=$(echo "$TAG_OBJ" | jq -r '.object.type')
              SHA=$(echo "$TAG_OBJ" | jq -r '.object.sha')
              if [[ "$TYPE" == "commit" ]]; then
                COMMIT_SHA="$SHA"
              elif [[ "$TYPE" == "tag" ]]; then
                COMMIT_SHA=$(gh api repos/${OWNER_REPO}/git/tags/${SHA} -q '.object.sha' || echo "")
              fi
            fi
            if [[ -n "$COMMIT_SHA" ]]; then
              # Latest successful run built from the same commit
              RUN_ID=$(echo "$RUNS_JSON" | jq -r \
                "map(select((.event==\"push\" or .event==\"workflow_dispatch\") and .conclusion==\"success\" and .head_sha==\"$COMMIT_SHA\")) | sort_by(.created_at) | last | .id // \"\"")
            fi
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "No matching successful build run found for $REF."
            exit 0
          fi

          # Download all artifacts from the identified build run
          echo "Downloading artifacts from run $RUN_ID ..."
          gh run download "$RUN_ID" --repo "$OWNER_REPO" -D artifacts || true

      - name: Extract image tag from service metadata
        id: extract-tag
        shell: bash
        run: |
          set -euo pipefail

          SERVICE_NAME="${{ inputs.service-name }}"
          METADATA_FILE="artifacts/${SERVICE_NAME}-metadata.json"

          # Check if metadata file exists
          if [[ ! -f "$METADATA_FILE" ]]; then
            echo "Metadata file not found: $METADATA_FILE"
            echo "Available files in artifacts:"
            find artifacts -type f -name "*.json" || echo "No JSON files found"
            echo "image-tag=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Extract tag from metadata JSON
          # Handle both single line and multi-line tag values
          TAG=$(jq -r '.tag // ""' "$METADATA_FILE")
          if [[ -n "$TAG" && "$TAG" != "null" ]]; then
            # If tag contains multiple lines, prefer the one with branch-shortSHA format
            # Otherwise take the first non-empty line
            CLEAN_TAG=$(echo "$TAG" | tr '\r' '\n' | grep -E '[-_A-Za-z0-9.]+-[0-9a-f]{7,8}$' | head -n1 || true)
            if [[ -z "$CLEAN_TAG" ]]; then
              CLEAN_TAG=$(echo "$TAG" | tr '\r' '\n' | grep -E '\S' | head -n1 || true)
            fi
            echo "image-tag=$CLEAN_TAG" >> "$GITHUB_OUTPUT"
            echo "Found image tag for $SERVICE_NAME: $CLEAN_TAG"
          else
            echo "image-tag=" >> "$GITHUB_OUTPUT"
            echo "No tag found in metadata for $SERVICE_NAME"
          fi
