name: Deploy Keycloak to Production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-keycloak-production
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["OpenMemory Docker Build and Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  get-image-tag:
    uses: ./.github/workflows/deployment-get-image-tag.yml
    with:
      service-name: keycloak
      run-id: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.id || '' }}
      target-ref: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch && format('refs/heads/{0}', github.event.workflow_run.head_branch) || '' }}
      target-ref-name: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.head_branch || '' }}
    secrets: inherit

  deploy:
    needs: get-image-tag
    if: needs.get-image-tag.outputs.image-tag != '' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
          # auth-type: IDENTITY

      - name: Deploy Keycloak to container app
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: ${{ needs.get-image-tag.outputs.image-tag }}
          acrName: schoollawregistry
          containerAppName: login
          containerAppEnvironment: ComplianceTheatre2000
          resourceGroup: SchoolLawyer
          environmentVariables: KC_HOSTNAME=${{ vars.KC_HOSTNAME }} KC_LOG_LEVEL=INFO KC_DB_URL_DATABASE=${{ vars.KC_DB_URL_DATABASE }} KC_DB_USERNAME=keycloak_user KC_DB_URL_HOST=${{ vars.KC_DB_URL_HOST }} KC_DB_PASSWORD=secretRef:db-login-password KC_HTTP_ENABLED=true KC_HTTPS_PORT=8443 KEYCLOAK_ADMIN=dog KEYCLOAK_ADMIN_PASSWORD=secretRef:kc-admin-password KC_HTTP_PORT=8080 KC_PII_ENCKEY=secretRef:kc-pii-enckey
