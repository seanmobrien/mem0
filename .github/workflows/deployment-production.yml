# @format: yaml

name: Deploy to Production

permissions:
  contents: read
  id-token: write

on:
  workflow_run:
    workflows: ["OpenMemory Docker Build and Deploy"]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_branch, 'implementation/')) || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include:
          - containerAppName: mem0-api
            context: .
            image: openmemory-api
          - containerAppName: mem0-ui
            image: openmemory-ui
          - containerAppName: login
            image: openmemory-keycloak
            envVars: KC_HOSTNAME=${{ vars.KC_HOSTNAME }},KC_LOG_LEVEL=INFO,KC_DB_URL_DATABASE=${{ vars.KC_DB_URL_DATABASE }},KC_DB_USERNAME=keycloak_user,KC_DB_URL_HOST=${{ vars.KC_DB_URL_HOST }},KC_DB_PASSWORD=secretRef:db-login-password,KC_HTTP_ENABLED=true,KC_HTTPS_PORT=8443,KEYCLOAK_ADMIN=dog,KEYCLOAK_ADMIN_PASSWORD=secretRef:kc-admin-password,KC_HTTP_PORT=8080,KC_PII_ENCKEY=secretRef:kc-pii-enckey
    steps:
      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
          auth-type: IDENTITY

      - name: Compute image tag
        id: vars
        run: |
          SANITIZED_REF="${GITHUB_REF_NAME//\//-}"
          SHORT_SHA="${GITHUB_SHA::7}"
          echo "tag=${SANITIZED_REF}-${SHORT_SHA}" >> "$GITHUB_OUTPUT"

      - name: Deploy ${{ matrix.image}} to ${{ matrix.containerAppName }} (with env vars)
        if: matrix.envVars != '' && matrix.envVars != null
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: schoollawregistry.azurecr.io/${{ matrix.image }}:${{ steps.vars.outputs.tag }}
          acrName: schoollawregistry
          containerAppName: ${{ matrix.containerAppName }}
          containerAppEnvironment: ComplianceTheatre2000
          resourceGroup: SchoolLawyer
          environmentVariables: ${{ matrix.envVars }}

      - name: Deploy ${{ matrix.image}} to ${{ matrix.containerAppName }} (no env var changes)
        if: matrix.envVars == '' || matrix.envVars == null
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: schoollawregistry.azurecr.io/${{ matrix.image }}:${{ steps.vars.outputs.tag }}
          acrName: schoollawregistry
          containerAppName: ${{ matrix.containerAppName }}
          containerAppEnvironment: ComplianceTheatre2000
          resourceGroup: SchoolLawyer
