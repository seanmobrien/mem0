# @format: yaml

name: Deploy to Production

permissions:
  contents: read
  id-token: write

concurrency:
  group: deploy-production
  cancel-in-progress: true

on:
  workflow_run:
    workflows: ["OpenMemory Docker Build and Deploy"]
    types: [completed]
  workflow_dispatch:

jobs:
  prepare_deploy:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.build.outputs.matrix }}
      should_deploy: ${{ steps.build.outputs.should_deploy }}
    steps:
      - name: Download build metadata artifacts (from triggering run)
        if: github.event_name == 'workflow_run'
        uses: actions/download-artifact@v4
        with:
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
          path: artifacts
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # When manually triggered, locate the latest successful run of
      # "OpenMemory Docker Build and Deploy" for the same ref (branch/tag)
      # and download its artifacts. This lets you redeploy the last built images
      # without running a new build.
      - name: Resolve and download artifacts for manual trigger
        id: resolve_download
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Context used to locate build artifacts for the same branch/tag
          OWNER_REPO='${{ github.repository }}'
          WORKFLOW_NAME='OpenMemory Docker Build and Deploy'
          REF='${{ github.ref }}'
          REF_NAME='${{ github.ref_name }}'

          # Find workflow id by name
          # We locate the numeric workflow id because the runs API uses ids, not names
          WF_ID=$(gh api -q ".workflows[] | select(.name==\"${WORKFLOW_NAME}\").id" \
            repos/${OWNER_REPO}/actions/workflows || true)
          if [[ -z "$WF_ID" ]]; then
            echo "Workflow not found: $WORKFLOW_NAME"
            exit 0
          fi

          # List recent runs for that workflow
          # We fetch recent runs and filter client-side so we can support
          # both push and workflow_dispatch events consistently
          RUNS_JSON=$(gh api repos/${OWNER_REPO}/actions/workflows/${WF_ID}/runs --paginate -q '.workflow_runs[] | {id, event, conclusion, head_branch, head_sha, run_number, created_at}' | jq -s .)

          # Determine matching run for branch or tag
          # For branches we match on head_branch. For tags we resolve the tag to its
          # commit SHA and then match runs by head_sha. In both cases we select the
          # most recent successful run (sorted by created_at).
          RUN_ID=""
          if [[ "$REF" == refs/heads/* ]]; then
            # Latest successful run for the same branch
            RUN_ID=$(echo "$RUNS_JSON" | jq -r \
              "map(select((.event==\"push\" or .event==\"workflow_dispatch\") and .conclusion==\"success\" and .head_branch==\"$REF_NAME\")) | sort_by(.created_at) | last | .id // \"\"")
          elif [[ "$REF" == refs/tags/* ]]; then
            TAG_NAME="$REF_NAME"
            # Resolve commit SHA for the tag
            # Git tags can be lightweight (type=commit) or annotated (type=tag -> commit)
            TAG_OBJ=$(gh api repos/${OWNER_REPO}/git/ref/tags/${TAG_NAME} || true)
            COMMIT_SHA=""
            if [[ -n "$TAG_OBJ" ]]; then
              TYPE=$(echo "$TAG_OBJ" | jq -r '.object.type')
              SHA=$(echo "$TAG_OBJ" | jq -r '.object.sha')
              if [[ "$TYPE" == "commit" ]]; then
                COMMIT_SHA="$SHA"
              elif [[ "$TYPE" == "tag" ]]; then
                COMMIT_SHA=$(gh api repos/${OWNER_REPO}/git/tags/${SHA} -q '.object.sha' || echo "")
              fi
            fi
            if [[ -n "$COMMIT_SHA" ]]; then
              # Latest successful run built from the same commit
              RUN_ID=$(echo "$RUNS_JSON" | jq -r '
                map(select((.event=="push" or .event=="workflow_dispatch") and .conclusion=="success" and .head_sha=="'"$COMMIT_SHA"'")) | sort_by(.created_at) | last | .id // ""')
            fi
          fi

          if [[ -z "$RUN_ID" ]]; then
            echo "No matching successful build run found for $REF."
            exit 0
          fi

          # Download all artifacts from the identified build run into ./artifacts
          echo "Downloading artifacts from run $RUN_ID ..."
          gh run download "$RUN_ID" --repo "$OWNER_REPO" -D artifacts || true
          echo "resolved_run_id=$RUN_ID" >> "$GITHUB_OUTPUT"

      # Capture the resolved build run id for summary/reporting purposes.
      - name: Determine source build run id
        id: source_run
        shell: bash
        run: |
          # Expose the build run id we sourced artifacts from, for summaries/debugging
          if [[ "${{ github.event_name }}" == 'workflow_run' ]]; then
            echo "run_id=${{ github.event.workflow_run.id }}" >> "$GITHUB_OUTPUT"
          else
            echo "run_id=${{ steps.resolve_download.outputs.resolved_run_id }}" >> "$GITHUB_OUTPUT"
          fi

      # Parse the downloaded metadata.json files to construct a per-service deploy matrix
      # (containerAppName, image name, exact tag) and decide whether deployment is allowed
      # for the source ref (implementation/school-law branch or release/* tags).
      - name: Build dynamic deploy matrix and gating
        id: build
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          # 1) Collect metadata.json files produced by the build workflow (one per service)
          #    Structure per file:
          #    {
          #      "service": "api|ui|keycloak",
          #      "image":   "openmemory-<svc>",
          #      "branch":  "<ref_name>",
          #      "tag":     "<one or more tags>"  // often multiple lines from metadata-action
          #    }
          #    Artifacts may unpack into subfolders; we search recursively.
          mapfile -t files < <(find artifacts -type f -name 'metadata.json' | sort)
          if (( ${#files[@]} == 0 )); then
            # No artifacts => nothing to deploy
            echo "matrix=[]" >> "$GITHUB_OUTPUT"
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # 2) Helper mappers
          #    - map_service: translate service key to Container App name
          #    - map_envvars: mark services that require env vars (keycloak)
          map_service() {
            local svc="$1"
            case "$svc" in
              api) echo "mem0-api" ;;
              ui) echo "mem0-ui" ;;
              keycloak) echo "login" ;;
              neo4j) echo "neo4j" ;;
              *) echo "$svc" ;;
            esac
          }

          map_envvars() {
            local svc="$1"
            case "$svc" in
              keycloak) 
                echo "KC_HOSTNAME=\${{ vars.KC_HOSTNAME }},KC_LOG_LEVEL=INFO,KC_DB_URL_DATABASE=\${{ vars.KC_DB_URL_DATABASE }},KC_DB_USERNAME=keycloak_user,KC_DB_URL_HOST=\${{ vars.KC_DB_URL_HOST }},KC_DB_PASSWORD=secretRef:db-login-password,KC_HTTP_ENABLED=true,KC_HTTPS_PORT=8443,KEYCLOAK_ADMIN=dog,KEYCLOAK_ADMIN_PASSWORD=secretRef:kc-admin-password,KC_HTTP_PORT=8080,KC_PII_ENCKEY=secretRef:kc-pii-enckey"
                ;;
              api) 
                echo "PGVECTOR_HOST=\${{ vars.PGVECTOR_HOST }},LLM_AZURE_OPENAI_API_KEY=secretRef:openai-schoollaw-1k-key1,LLM_AZURE_API_VERSION=\${{ vars.LLM_AZURE_API_VERSION }},LLM_AZURE_DEPLOYMENT=\${{ vars.LLM_AZURE_DEPLOYMENT }},LLM_AZURE_ENDPOINT=\${{ vars.LLM_AZURE_ENDPOINT }},USER=\${{ vars.USER }},GRAPH_URI=\${{ vars.GRAPH_URI }},GRAPH_USERNAME=\${{ vars.GRAPH_USERNAME }},GRAPH_PASSWORD=secretRef:neo4j-password,NEXT_PUBLIC_URL=\${{ vars.NEXT_PUBLIC_URL }},PUBLIC_URL=\${{ vars.PUBLIC_URL }},VERCEL=\${{ vars.VERCEL }},PGVECTOR_USER=\${{ vars.PGVECTOR_USER }},EMBEDDING_AZURE_ENDPOINT=\${{ vars.EMBEDDING_AZURE_ENDPOINT }},PGVECTOR_PORT=\${{ vars.PGVECTOR_PORT }},PGVECTOR_DB=\${{ vars.PGVECTOR_DB }},PGVECTOR_COLLECTION_NAME=\${{ vars.PGVECTOR_COLLECTION_NAME }},PGVECTOR_DISKANN=\${{ vars.PGVECTOR_DISKANN }},MEMGRAPH_USERNAME=\${{ vars.MEMGRAPH_USERNAME }},EMBEDDING_AZURE_API_VERSION=\${{ vars.EMBEDDING_AZURE_API_VERSION }},EMBEDDING_AZURE_DEPLOYMENT=\${{ vars.EMBEDDING_AZURE_DEPLOYMENT }},OPENAI_API_KEY=secretRef:openai-schoollawbot-1k-switzerland-key1,EMBEDDING_AZURE_OPENAI_API_KEY=secretRef:openai-schoollaw-embedding,PGVECTOR_PASSWORD=secretRef:postgresql-password,DATABASE_URL=\${{ vars.DATABASE_URL }},MEM0_PROVIDER_VECTORSTORE=\${{ vars.MEM0_PROVIDER_VECTORSTORE }},MEM0_PROVIDER_GRAPHSTORE=\${{ vars.MEM0_PROVIDER_GRAPHSTORE }},MEM0_PROVIDER_LLM=\${{ vars.MEM0_PROVIDER_LLM }},PG_HNSW=\${{ vars.PG_HNSW }},PG_TIMESCALE=\${{ vars.PG_TIMESCALE }},KEYCLOAK_SERVER_URL=\${{ vars.KEYCLOAK_SERVER_URL }},KEYCLOAK_REALM=\${{ vars.KEYCLOAK_REALM }},KEYCLOAK_CLIENT_ID=secretRef:keystore-client-id,KEYCLOAK_CLIENT_SECRET=secretRef:keystore-client-secret,AUTH_ENABLED=\${{ vars.AUTH_ENABLED }}"
                ;;
              neo4j)
                echo "NEO4J_AUTH=secretRef:neo4j-password,NEO4J_ACCEPT_LICENSE_AGREEMENT=yes"
                ;;
              *) 
                echo ""
                ;;
            esac
          }

          # 3) Build matrix JSON: include only the exact services found in artifacts.
          #    For each service metadata:
          #      - Choose a canonical tag: prefer branch-or-name-shortSHA (e.g., feature-x-abc1234)
          #        by matching '<something>-<7/8 hex>' at the end; fall back to the first non-empty tag line.
          #      - Carry forward the image name and map to container app name.
          #    Also capture the first seen branch to drive gating logic below.
          matrix='['
          branch_ref=""
          for f in "${files[@]}"; do
            svc=$(jq -r .service "$f")
            img=$(jq -r .image "$f")
            # tags field may contain multiple lines.
            # Expected tag format: <branch-or-name>-<sha>, e.g., feature-abc1234 or release-1.2.3-abcdef1
            # This regex matches tags ending with a dash and a 7 or 8 character hex SHA.
            tag=$(jq -r .tag "$f" | tr '\r' '\n' | grep -E '[-_A-Za-z0-9.]+-[0-9a-f]{7,8}$' | head -n1 || true)
            if [[ -z "$tag" || "$tag" == "null" ]]; then
              # fallback to first non-empty line
              tag=$(jq -r .tag "$f" | tr '\r' '\n' | grep -E '\S' | head -n1 || true)
            fi
            branch=$(jq -r .branch "$f")
            [[ -z "$branch_ref" ]] && branch_ref="$branch"
            appName=$(map_service "$svc")
            envVars=$(map_envvars "$svc")
            matrix+="{\"containerAppName\":\"$appName\",\"image\":\"$img\",\"tag\":\"$tag\",\"envVars\":\"$envVars\"},"
          done
          matrix="${matrix%,}]"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

          # 4) Always deploy - no gating logic
          #    Deploy for all triggers and branches
          should=true
          echo "should_deploy=$should" >> "$GITHUB_OUTPUT"

      - name: Summarize deploy plan
        if: always()
        shell: bash
        run: |
          MATRIX='${{ steps.build.outputs.matrix }}'
          RUN_ID='${{ steps.source_run.outputs.run_id }}'
          SHOULD='${{ steps.build.outputs.should_deploy }}'
          {
            echo "### Deploy plan"
            if [[ -n "$RUN_ID" ]]; then
              echo "- Source build run: $RUN_ID"
            fi
            echo "- Should deploy: $SHOULD"
            if [[ -z "$MATRIX" || "$MATRIX" == '[]' ]]; then
              echo "- Services: none (no artifacts)"
            else
              echo "- Services to deploy:"
              echo "$MATRIX" | jq -r '.[] | "  - " + .containerAppName + " ← " + .image + ":" + .tag'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: prepare_deploy
    if: needs.prepare_deploy.outputs.should_deploy == 'true' && ((github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.prepare_deploy.outputs.matrix) }}
    steps:
      - name: Azure Login
        uses: azure/login@v2.3.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          enable-AzPSSession: true
          # Switched from service principal authentication to managed identity for improved security and alignment with Azure best practices.
          auth-type: IDENTITY

      # Tag is provided by build metadata via the dynamic matrix (matrix.tag)

      - name: Deploy ${{ matrix.image}} to ${{ matrix.containerAppName }} (with environment variables)
        if: matrix.envVars != ''
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: schoollawregistry.azurecr.io/${{ matrix.image }}:${{ matrix.tag }}
          acrName: schoollawregistry
          containerAppName: ${{ matrix.containerAppName }}
          containerAppEnvironment: ComplianceTheatre2000
          resourceGroup: SchoolLawyer
          environmentVariables: ${{ matrix.envVars }}

      - name: Deploy ${{ matrix.image}} to ${{ matrix.containerAppName }} (no environment variables)
        if: matrix.envVars == ''
        uses: azure/container-apps-deploy-action@v2
        with:
          imageToDeploy: schoollawregistry.azurecr.io/${{ matrix.image }}:${{ matrix.tag }}
          acrName: schoollawregistry
          containerAppName: ${{ matrix.containerAppName }}
          containerAppEnvironment: ComplianceTheatre2000
          resourceGroup: SchoolLawyer
