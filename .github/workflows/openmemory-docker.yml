# @format

name: OpenMemory Docker Build and Deploy

on:
  push:
    branches: [implementation/school-law, development]
    tags: ["release/*"]
    paths:
      - "openmemory/**"
      - "mem0/**"
      - "pyproject.toml"
      - "build_local.py"
      - ".github/workflows/openmemory-docker.yml"
      - ".github/workflows/deployment-production.yml"
  pull_request:
    branches: [implementation/school-law, development]
    paths:
      - "openmemory/**"
      - "mem0/**"
      - "pyproject.toml"
      - "build_local.py"
      - ".github/workflows/openmemory-docker.yml"
      - ".github/workflows/deployment-production.yml"
  workflow_dispatch:

env:
  REGISTRY: schoollawregistry.azurecr.io
  API_IMAGE_NAME: openmemory-api
  UI_IMAGE_NAME: openmemory-ui
  SRV_IMAGE_NAME: openmemory-mem0
  KEYCLOAK_IMAGE_NAME: openmemory-keycloak
  NEO4J_IMAGE_NAME: openmemory-neo4j

jobs:
  # Check which services have been changed in this push.
  check_changes:
    permissions:
      id-token: write
      contents: read
    runs-on: ubuntu-latest
    outputs:
      api_changed: ${{ steps.filter.outputs.api }}
      ui_changed: ${{ steps.filter.outputs.ui }}
      keycloak_changed: ${{ steps.filter.outputs.keycloak }}
      neo4j_changed: ${{ steps.filter.outputs.neo4j }}
    steps:
      - uses: actions/checkout@v4
      - id: filter
        uses: dorny/paths-filter@v2
        with:
          filters: |
            api:
              - 'openmemory/api/**'
              - 'mem0/**'
              - 'pyproject.toml'
              - 'build_local.py'
              - '.github/workflows/openmemory-docker.yml'
              - '.github/workflows/deployment-*.yml'
            ui:
              - 'openmemory/ui/**'
              - 'mem0/**'
              - '.github/workflows/openmemory-docker.yml'
              - '.github/workflows/deployment-*.yml'
            keycloak:
              - 'openmemory/keycloak/**'
              - '.github/workflows/openmemory-docker.yml'
              - '.github/workflows/deployment-*.yml'
            neo4j:
              - 'openmemory/neo4j/**'
              - '.github/workflows/openmemory-docker.yml'
              - '.github/workflows/deployment-*.yml'

  # Generate service matrix based on changed components; this ensures we only build
  # and push images for services that have relevant changes, or all services on manual runs.
  generate_matrix:
    needs: check_changes
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.choose.outputs.matrix }}
      any_changed: ${{ steps.choose.outputs.any_changed }}
    steps:
      - id: set_matrix_changed
        if: github.event_name != 'workflow_dispatch'
        run: |
          matrix='['
          if [[ "${{ needs.check_changes.outputs.api_changed }}" == 'true' ]]; then
            matrix+='{"service":"api","dockerfile":"openmemory/api/Dockerfile","context":".","image":"openmemory-api"},'
          fi
          if [[ "${{ needs.check_changes.outputs.ui_changed }}" == 'true' ]]; then
            matrix+='{"service":"ui","dockerfile":"openmemory/ui/Dockerfile","context":"openmemory/ui","image":"openmemory-ui"},'
          fi
          if [[ "${{ needs.check_changes.outputs.keycloak_changed }}" == 'true' ]]; then
            matrix+='{"service":"keycloak","dockerfile":"openmemory/keycloak/Dockerfile","context":"openmemory/keycloak","image":"openmemory-keycloak"},'
          fi
          if [[ "${{ needs.check_changes.outputs.neo4j_changed }}" == 'true' ]]; then
            matrix+='{"service":"neo4j","dockerfile":"openmemory/neo4j/Dockerfile","context":"openmemory/neo4j","image":"openmemory-neo4j"},'
          fi
          matrix="${matrix%,}]"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          if [[ "$matrix" == '[]' ]]; then
            echo "any_changed=false" >> $GITHUB_OUTPUT
          else
            echo "any_changed=true" >> $GITHUB_OUTPUT
          fi

      - id: set_matrix_manual
        if: github.event_name == 'workflow_dispatch'
        run: |
          matrix='['
          matrix+='{"service":"api","dockerfile":"openmemory/api/Dockerfile","context":".","image":"openmemory-api"},'
          matrix+='{"service":"ui","dockerfile":"openmemory/ui/Dockerfile","context":"openmemory/ui","image":"openmemory-ui"},'
          matrix+='{"service":"keycloak","dockerfile":"openmemory/keycloak/Dockerfile","context":"openmemory/keycloak","image":"openmemory-keycloak"},'
          matrix+='{"service":"neo4j","dockerfile":"openmemory/neo4j/Dockerfile","context":"openmemory/neo4j","image":"openmemory-neo4j"},'
          matrix="${matrix%,}]"
          echo "matrix=$matrix" >> $GITHUB_OUTPUT
          echo "any_changed=true" >> $GITHUB_OUTPUT

      - id: choose
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            matrix='${{ steps.set_matrix_manual.outputs.matrix }}'
            any='${{ steps.set_matrix_manual.outputs.any_changed }}'
          else
            matrix='${{ steps.set_matrix_changed.outputs.matrix }}'
            any='${{ steps.set_matrix_changed.outputs.any_changed }}'
          fi
          [[ -z "$matrix" ]] && matrix='[]'
          [[ -z "$any" ]] && any='false'
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "any_changed=$any" >> "$GITHUB_OUTPUT"

  # Build images for changed services and push to Azure Container Registry.
  build_and_push:
    needs: generate_matrix
    if: >-
      needs.generate_matrix.result == 'success' && needs.generate_matrix.outputs.any_changed == 'true' && (
        github.event_name == 'pull_request' ||
        github.ref == 'refs/heads/implementation/school-law' ||
        startsWith(github.ref, 'refs/tags/release/')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        include: ${{ fromJson(needs.generate_matrix.outputs.matrix) }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Summarize planned services (PRs)
        if: github.event_name == 'pull_request'
        shell: bash
        run: |
          MATRIX='${{ needs.generate_matrix.outputs.matrix }}'
          {
            echo '### Planned services to build'
            if [[ "$MATRIX" == "[]" || -z "$MATRIX" ]]; then
              echo 'No services changed.'
            else
              echo 'These services will be built (no push on PRs):'
              echo "$MATRIX" | jq -r '.[].service' | sed 's/^/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compute branch prefix for SHA tag
        id: compute_prefix
        shell: bash
        run: |
          # Derive a safe Docker tag prefix from the branch name, if present
          RAW_BRANCH="${GITHUB_REF_NAME}"
          PREFIX=""
          if [[ -n "$RAW_BRANCH" ]]; then
            # Sanitize branch name for Docker tag:
            # 1. Lowercase
            SAFE=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]')
            # 2. Replace invalid characters with '-'
            SAFE=$(echo "$SAFE" | sed -E 's/[^a-z0-9._-]+/-/g')
            # 3. Trim leading dashes
            SAFE=$(echo "$SAFE" | sed -E 's/^-+//')
            # 4. Trim trailing dashes
            SAFE=$(echo "$SAFE" | sed -E 's/-+$//')
            # 5. Collapse multiple dashes
            SAFE=$(echo "$SAFE" | sed -E 's/-{2,}/-/g')
            if [[ -n "$SAFE" ]]; then
              PREFIX="${SAFE}-"
            fi
          fi
          echo "sha_prefix=$PREFIX" >> "$GITHUB_OUTPUT"

      - name: Log in to Azure Container Registry (token)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ matrix.image }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr            
            type=sha,format=short,prefix=${{ steps.compute_prefix.outputs.sha_prefix }}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/implementation/school-law' }}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64
          build-args: |
            BUILD_TYPE=distribution-build
            GITHUB_REF_NAME=${{ github.ref_name }}
            GITHUB_RUN_ID=${{ github.run_id }}
            GITHUB_SHA=${{ github.sha }}
            GITHUB_ACTOR=${{ github.actor }}
            GITHUB_WORKFLOW=${{ github.workflow }}
            KC_DB_URL_DATABASE=${{ vars.KC_DB_URL_DATABASE }}

      - name: Write output digest to metadata file
        if: github.event_name != 'pull_request'
        run: |
          # Generate clean metadata with individual components
          # This avoids complex tag parsing and lets deployment workflows construct what they need

          # Get short SHA (first 7 chars)
          SHORT_SHA="${GITHUB_SHA:0:7}"

          # Create branch-safe prefix for tag construction
          RAW_BRANCH="${{ github.ref_name }}"
          BRANCH_PREFIX=""
          if [[ -n "$RAW_BRANCH" ]]; then
            # Sanitize branch name for Docker tag (stepwise for clarity)
            SAFE_LOWER=$(echo "$RAW_BRANCH" | tr '[:upper:]' '[:lower:]')
            SAFE_ALNUM=$(echo "$SAFE_LOWER" | sed -E 's/[^a-z0-9._-]+/-/g')
            SAFE_TRIM=$(echo "$SAFE_ALNUM" | sed -E 's/^-+|[-]+$//g')
            SAFE=$(echo "$SAFE_TRIM" | sed -E 's/-{2,}/-/g')
            if [[ -n "$SAFE" ]]; then
              BRANCH_PREFIX="${SAFE}-"
            fi
          fi

          # Construct the tag we want to use (branch-prefix + short SHA)
          TAG="${BRANCH_PREFIX}${SHORT_SHA}"

          echo "{\"service\": \"${{ matrix.service }}\", \"image\": \"${{ matrix.image }}\", \"branch\": \"${{ github.ref_name }}\", \"registry\": \"${{ env.REGISTRY }}\", \"tag\": \"$TAG\", \"sha\": \"$GITHUB_SHA\", \"short_sha\": \"$SHORT_SHA\", \"repository\": \"${{ github.repository }}\"}" > metadata.json

          echo "Generated metadata for ${{ matrix.service }}:"
          cat metadata.json

      - name: Upload build metadata artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-metadata
          path: metadata.json
