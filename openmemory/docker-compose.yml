services:
  # Vector store for mem0
  mem0_store:
    image: qdrant/qdrant
    ports:
      - "6333:6333"
    volumes:
      - mem0_storage:/mem0/storage

  # PostgreSQL database for Keycloak
  # postgres:
  #   image: postgres:15-alpine
  #   environment:
  #     POSTGRES_DB: keycloak
  #     POSTGRES_USER: keycloak
  #     POSTGRES_PASSWORD: keycloak
  #   volumes:
  #     - keycloak_db:/var/lib/postgresql/data
  #   ports:
  #     - "5432:5432"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5

  # Keycloak authentication provider
  keycloak:
    build: keycloak/
    image: openmemory-keycloak
    environment:
      KC_DB: keycloak
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: ${KEYCLOAK_DBLOGIN_USER}
      KC_DB_PASSWORD: ${KEYCLOAK_DBLOGIN_PW}
      KC_HOSTNAME: localhost
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PW}
    ports:
      - "8080:8080"
    # depends_on:
    #   postgres:
    #     condition: service_healthy
    command: ["start", "--dev"]

  # OpenMemory API
  openmemory-mcp:
    image: mem0/openmemory-mcp
    build: api/
    environment:
      - USER
      - API_KEY
      - KEYCLOAK_SERVER_URL=http://keycloak:8080
      - KEYCLOAK_REALM=openmemory
      - KEYCLOAK_CLIENT_ID=openmemory-api
    env_file:
      - api/.env
    depends_on:
      - mem0_store
      - keycloak
    ports:
      - "8765:8765"
    volumes:
      - ./api:/usr/src/openmemory
    command: >
      sh -c "uvicorn main:app --host 0.0.0.0 --port 8765 --reload --workers 4"

  # OpenMemory UI
  openmemory-ui:
    build:
      context: ui/
      dockerfile: Dockerfile
    image: mem0/openmemory-ui:latest
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_USER_ID=${USER}
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-here
      - KEYCLOAK_ID=openmemory-ui
      - KEYCLOAK_SECRET=
      - KEYCLOAK_ISSUER=http://localhost:8080/realms/openmemory
    depends_on:
      - keycloak
      - openmemory-mcp

  # Certbot Azure - Let's Encrypt certificate manager with Azure Key Vault integration
  certbot-azure:
    build:
      context: certbot-azure/
      dockerfile: Dockerfile
    image: openmemory/certbot-azure:latest
    volumes:
      - certbot-certs:/mnt/secrets-output
    environment:
      # Certificate configuration
      - CERTMGR_DOMAIN=${CERTMGR_DOMAIN}
      - CERTMGR_EMAIL=${CERTMGR_EMAIL}
      - CERTMGR_DESEC_TOKEN=${CERTMGR_DESEC_TOKEN}
      # Azure configuration
      - CERTMGR_AZURE_TENANT_ID=${CERTMGR_AZURE_TENANT_ID}
      - CERTMGR_AZURE_CLIENT_ID=${CERTMGR_AZURE_CLIENT_ID}
      - CERTMGR_AZURE_CLIENT_SECRET=${CERTMGR_AZURE_CLIENT_SECRET}
      - CERTMGR_AZURE_KEYVAULT_NAME=${CERTMGR_AZURE_KEYVAULT_NAME}
      - CERTMGR_AZURE_CERT_NAME=${CERTMGR_AZURE_CERT_NAME}
      # Optional configuration
      - CERTMGR_RENEWAL_MODE=${CERTMGR_RENEWAL_MODE:-false}
      - CERTMGR_STAGING=${CERTMGR_STAGING:-false}
      - CERTMGR_KEEPALIVE=${CERTMGR_KEEPALIVE:-false}
    # Comment out to run the service, uncomment to disable
    profiles:
      - certbot

volumes:
  mem0_storage:
  keycloak_db:
  certbot-certs:
